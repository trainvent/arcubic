name: Release Arcubic

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (version !== process.env.GITHUB_REF_NAME) throw new Error("Tag must match package.json version");'
      - run: npm ci
      - run: npm run build:themes
      - run: npm run build
      - run: npm run test:palette
      - run: npm run package:release
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/"$GITHUB_REF_NAME"/* --verify-tag --title "Arcubic $GITHUB_REF_NAME" --notes-file docs/alpha-release.md
