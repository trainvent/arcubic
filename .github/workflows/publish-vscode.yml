name: Publish Arcubic to VS Code extension stores

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: vscode-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check release version
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (version !== process.env.RELEASE_VERSION) throw new Error("Tag must match package.json version");'
      - run: npm ci
      - run: npm run test:palette
      - run: npm run pack:vscode
      - name: Publish to the VS Code Marketplace through trusted publishing
        run: npx vsce publish --oidc --skip-duplicate --packagePath "dist/arcubic-vscode-${RELEASE_VERSION}.vsix"
      # Open VSX uses the OVSX_PAT token while it is set, and trusted publishing once it is removed.
      - name: Publish to Open VSX
        if: ${{ !cancelled() }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "dist/arcubic-vscode-${RELEASE_VERSION}.vsix" --skip-duplicate
