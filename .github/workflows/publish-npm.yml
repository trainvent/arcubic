name: Publish Arcubic to npm

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to publish
        required: true
        default: '0.3.0'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (version !== process.env.RELEASE_VERSION) throw new Error("Tag must match package.json version");'
      - run: npm ci
      - run: npm run test:palette
      - run: npm run pack:react
      - name: Publish through npm trusted publishing
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: npm publish "dist/trainvent-arcubic-${RELEASE_VERSION}.tgz" --access public
